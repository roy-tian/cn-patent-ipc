name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Publish (tag must match package.json version)
        id: publish
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag v$TAG_VERSION does not match package $PKG_VERSION - skipping publish and release"
            exit 0
          fi
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION is already on npm - skipping publish"
          else
            # No NODE_AUTH_TOKEN: auth comes from npm trusted publishing (OIDC)
            npm publish --provenance --access public
          fi
          # tag 与版本一致且该版本已在 npm 上(本次发布或早已发布)就放行 release 步骤,
          # 这样发布成功但建 release 失败时,重跑能补建
          echo "release=true" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        if: steps.publish.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 已存在则不动,重跑幂等。不传 --latest,交给 GitHub 按版本与日期判定,
          # 以免重跑旧 tag 时把旧版本标成 latest
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists - nothing to do"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
